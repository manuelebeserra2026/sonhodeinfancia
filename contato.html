		<script language="javascript" type="text/javascript">
			function validar(){
                var nome = usuario.nome.value;
                var nota = usuario.nota.value;

                if(nome=="")

                    alert('Preencha o CAMPO DO NOME!!!');

                    return false;
                }
                if(nota=="")
                {
                    alert('Selecione uma NOTA!!!');
                    usuario.nota.focus();
                    return false;
                }
                return true;
            }
            function processarform(){
